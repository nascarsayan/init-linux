# Line 1:  user@host ~/dir  branch +1 !2  5s [fill] 14:30:00
# Line 2:  ❯

format = "$username$hostname$directory$git_branch$git_status$cmd_duration$fill$time\n$character"

add_newline = true

[fill]
symbol = " "

[username]
disabled = false
show_always = false
format = "[$user]($style)"
style_user = "fg:#7a8a99"
style_root = "fg:#c28a6e"

[hostname]
disabled = false
ssh_only = true
format = "[@$hostname]($style) "
style = "fg:#7a8a99"

[directory]
style = "fg:#89b4d4"
truncation_length = 5
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)"
home_symbol = "~"

[git_branch]
symbol = ""
format = "  [$branch]($style)"
style = "fg:#7a8a99"
truncation_length = 32
truncation_symbol = "…"
always_show_remote = false

[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = "fg:#c8a96e"
staged     = "+$count "
modified   = "!$count "
untracked  = "?$count "
conflicted = "~$count "
deleted    = "✘$count "
renamed    = "»$count "
stashed    = "*$count "
ahead      = "⇡$count"
behind     = "⇣$count"
diverged   = "⇡$ahead_count⇣$behind_count"
up_to_date = ""

[cmd_duration]
min_time = 3000
format = "  [$duration]($style)"
style = "fg:#8a9a7a"
show_milliseconds = false

[time]
disabled = false
format = "[$time]($style)"
style = "fg:#556070"
time_format = "%H:%M:%S"
utc_time_offset = "local"

[character]
success_symbol = "[❯](fg:#b48ead)"
error_symbol   = "[❯](fg:#a05a5a)"
vimcmd_symbol  = "[❮](fg:#b48ead)"

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
